[package]
name = "rdx-pdf"
version = "0.1.0"
description = "Receipt Dropbox PDF text layer: words and their positions from a PDF's text, in pure Rust, for statements and receipts"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `rdx` registers this crate's ops (its `register` function) when it is a dependency of
# rdx-cli; see crates/rdx-cli/build.rs.
[package.metadata.rdx]
ops = true

[features]
default = []
# A minimal PDF writer (standard fonts, text only) for building synthetic fixtures.
write = []

[dependencies]
# PDF standard security (password-protected statements): MD5 and RC4 for revisions 2 to 4, AES
# for 4 to 6, SHA-2 for 5 and 6. RustCrypto's pure-Rust implementations, which need no
# randomness to decrypt, so they build for both wasm targets.
aes = "0.8"
md-5 = "0.10"
# Pure Rust and allocation-only, so the reader builds for both wasm targets. lopdf would be the
# obvious choice, but it pulls in getrandom, which has no wasm32-unknown-unknown backend without
# JavaScript.
miniz_oxide = "0.8"
rdx-plan = { path = "../rdx-plan", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
rdx-pdf = { path = ".", features = ["write"] }
