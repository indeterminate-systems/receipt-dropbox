[package]
name = "rdx-statement"
version = "0.1.0"
description = "Receipt Dropbox statement parsing: CSV, OFX and PDF layouts into the domain model, with balance checks"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `rdx` registers this crate's ops (its `register` function) when it is a dependency of
# rdx-cli; see crates/rdx-cli/build.rs.
[package.metadata.rdx]
ops = true

[features]
default = []
# Renders statements as OFX and as the example-bank PDF layout, for synthetic fixtures.
render = ["rdx-pdf/write"]

[dependencies]
# Remembered statement passwords are envelopes encrypted to the supporter's keys (rdx-keys).
bc-envelope = { version = "0.43", default-features = false, features = ["known_value", "encrypt", "recipient"] }
rdx-keys = { path = "../rdx-keys" }
rdx-model = { path = "../rdx-model" }
rdx-pdf = { path = "../rdx-pdf" }
rdx-plan = { path = "../rdx-plan", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Wipes passwords from memory once used.
zeroize = "1"

[dev-dependencies]
rdx-host = { path = "../rdx-host" }
rdx-plan = { path = "../rdx-plan" }
rdx-statement = { path = ".", features = ["render"] }
