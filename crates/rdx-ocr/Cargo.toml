[package]
name = "rdx-ocr"
version = "0.1.0"
description = "Receipt Dropbox OCR fallback: reads scanned PDFs and photos of statements and receipts with ocrs, in pure Rust"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `rdx` registers this crate's ops (its `register` function) when it is a dependency of
# rdx-cli; see crates/rdx-cli/build.rs.
[package.metadata.rdx]
ops = true

[dependencies]
# Decodes PNG and JPEG (scanners' and phones' formats) in pure Rust; no other formats, so the
# dependency tree stays small.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# OCR engine and its neural-network runtime, both pure Rust; see docs/adr/ADR-P11-ocr.md. Without
# default features ocrs doesn't build its JavaScript API; `rten` reads the `.rten` model format.
ocrs = { version = "0.14", default-features = false, features = ["rten"] }
rten = { version = "0.28", default-features = false, features = ["rten_format"] }
rdx-pdf = { path = "../rdx-pdf" }
rdx-plan = { path = "../rdx-plan", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The scanned-statement fixture is a JPEG, written with the `image` encoder.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rdx-host = { path = "../rdx-host" }
rdx-pdf = { path = "../rdx-pdf", features = ["write"] }
rdx-plan = { path = "../rdx-plan" }
rdx-receipt = { path = "../rdx-receipt" }
rdx-statement = { path = "../rdx-statement" }
