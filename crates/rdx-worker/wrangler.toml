# The Receipt Dropbox intake Worker. Setup: README.md. Deploy from this directory:
#
#   wrangler deploy --var RDX_INTAKE_POLICY:"$(nickel export --format json --import-path ../../nickel policy.ncl)"
#
name = "rdx-intake"
main = "build/index.js"
compatibility_date = "2026-11-01"

[build]
command = "cargo xtask claim-page && worker-build --release"

# The claim page the setup reply links to (`/claim`), built by `cargo xtask claim-page`.
# Cloudflare serves these files itself; only `/claim/open` and `/claim/release` reach the Worker.
[assets]
directory = "site"

# The policy's `claim_url` must be served by this Worker. On a domain of your own (its DNS on
# Cloudflare), add it as a custom domain, and Cloudflare creates the DNS record and certificate:
# routes = [{ pattern = "app.yourorg.org", custom_domain = true }]

# Key registries, inboxes and quarantines. Create it with
# `wrangler kv namespace create RDX_KV` and paste the id it prints.
[[kv_namespaces]]
binding = "RDX_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Encrypted emails. Create it with `wrangler r2 bucket create rdx-blobs`.
[[r2_buckets]]
binding = "RDX_BLOBS"
bucket_name = "rdx-blobs"

# Deletes expired quarantines once a day (03:17 UTC).
[triggers]
crons = ["17 3 * * *"]

# Optional: expiry notices to senders. Needs Email Sending on the Workers Paid plan; without it
# the setup reply's own deadline is the only notice.
# [[send_email]]
# name = "RDX_EMAIL"
