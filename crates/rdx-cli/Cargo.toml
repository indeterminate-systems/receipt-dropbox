[package]
name = "rdx-cli"
version = "0.1.0"
description = "The local Receipt Dropbox host: `rdx run <skill>` is the agents' code-mode entrypoint"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rdx"
path = "src/main.rs"

# Domain crates (`[package.metadata.rdx] ops = true`) are registered by build.rs from this list:
# adding one here is all `rdx` needs. One line each, so parallel pieces' additions merge cleanly
# (see .gitattributes).
[dependencies]
rdx-envelope = { path = "../rdx-envelope" }
rdx-fiscal = { path = "../rdx-fiscal" }
rdx-host = { path = "../rdx-host", features = ["local"] }
rdx-intake = { path = "../rdx-intake" }
rdx-keys = { path = "../rdx-keys" }
rdx-ledger = { path = "../rdx-ledger" }
rdx-match = { path = "../rdx-match" }
rdx-ocr = { path = "../rdx-ocr" }
rdx-pdf = { path = "../rdx-pdf" }
rdx-plan = { path = "../rdx-plan" }
rdx-receipt = { path = "../rdx-receipt" }
rdx-render = { path = "../rdx-render" }
rdx-statement = { path = "../rdx-statement" }
serde_json.workspace = true

[build-dependencies]
toml = "1"

[dev-dependencies]
nickel-embed.workspace = true
tempfile = "3"
