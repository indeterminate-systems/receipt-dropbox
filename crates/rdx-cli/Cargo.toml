[package]
name = "rdx-cli"
version = "0.1.0"
description = "The local Receipt Dropbox host: `rdx run <skill>` is the agents' code-mode entrypoint"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rdx"
path = "src/main.rs"

[dependencies]
rdx-host = { path = "../rdx-host", features = ["local"] }
rdx-match = { path = "../rdx-match" }
rdx-pdf = { path = "../rdx-pdf" }
rdx-plan = { path = "../rdx-plan" }
rdx-receipt = { path = "../rdx-receipt" }
rdx-statement = { path = "../rdx-statement" }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
