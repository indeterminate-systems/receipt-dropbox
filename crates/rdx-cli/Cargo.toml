[package]
name = "rdx-cli"
version = "0.1.0"
description = "The local Receipt Dropbox host: `rdx run <skill>` is the agents' code-mode entrypoint"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rdx"
path = "src/main.rs"

[dependencies]
rdx-envelope = { path = "../rdx-envelope" }
rdx-host = { path = "../rdx-host", features = ["local"] }
rdx-plan = { path = "../rdx-plan" }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
