[package]
name = "rdx-envelope"
version = "0.1.0"
description = "Receipt Dropbox statements as signed Gordian Envelopes: salted lines, elision of unmatched lines, verification"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `rdx` registers this crate's ops (its `register` function) when it is a dependency of
# rdx-cli; see crates/rdx-cli/build.rs.
[package.metadata.rdx]
ops = true

[dependencies]
# Only what statements need: salted assertions and Ed25519 signatures; encryption to recipients is
# rdx-keys' business. The default features add secp256k1 (C) and post-quantum signatures, neither
# of which the core uses.
bc-envelope = { version = "0.43", default-features = false, features = ["salt", "signature", "ed25519", "known_value"] }
bc-components = { version = "0.31", default-features = false, features = ["ed25519"] }
bc-rand = "0.5"
rdx-host = { path = "../rdx-host" }
# Keys, encryption to recipients, and the browser's getrandom stub (src/no_system_rng.rs there).
rdx-keys = { path = "../rdx-keys" }
rdx-model = { path = "../rdx-model" }
# Ops and their registry only; plan loading (Nickel) is the host's business.
rdx-plan = { path = "../rdx-plan", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

