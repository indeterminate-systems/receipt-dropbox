[package]
name = "xtask"
version = "0.0.0"
description = "Repository checks, written in Rust: `cargo xtask check`"
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
# Skills' test cases run with the local host's ops (`rdx_cli::registry`).
rdx-cli = { path = "../crates/rdx-cli" }
rdx-host = { path = "../crates/rdx-host" }
rdx-plan = { path = "../crates/rdx-plan" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
wit-parser = "0.263"
