name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  flake:
    name: Flake (lockfile, formatting, dev shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/flake-checker-action@main
        with:
          fail-mode: true
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix flake check

  # Everything else runs inside the dev shell, so CI uses exactly the toolchain, wasm targets
  # and tools that `nix develop` gives people and agents. `cargo xtask ci` lists the steps.
  rust:
    name: Rust, WebAssembly and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: Swatinem/rust-cache@v2
        with:
          # The runner's own rustc is not the one that builds; key on the pinned toolchain.
          key: flake-${{ hashFiles('flake.lock') }}
      - run: nix develop --command cargo xtask ci
