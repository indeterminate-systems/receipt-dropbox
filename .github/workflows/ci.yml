name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: WebAssembly builds
        run: |
          for target in wasm32-unknown-unknown wasm32-wasip2; do
            cargo check -p rdx-plan --target "$target"
            cargo check -p rdx-plan --target "$target" --no-default-features
            cargo check -p rdx-host --target "$target" --all-features
            cargo check -p rdx-cli --target "$target"
            cargo check -p rdx-model --target "$target"
          done
      - name: Skills
        run: cargo xtask check
      - name: WIT matches rdx-host
        run: cargo xtask check-wit
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: rdx as WebAssembly under wasmtime
        run: cargo xtask smoke-wasm
